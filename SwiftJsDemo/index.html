<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Swift ↔ JS</title>
</head>

<body>

  <h1>Swift ↔ JavaScript</h1>

  <button onclick="sendToSwift()">Send Message to Swift</button>

  <p id="response"></p>

  <script>
    // JS → Swift
    function sendToSwift() {
      window.webkit.messageHandlers.iosListener.postMessage({
        message: "Hello from JavaScript"
      });
    }

    // Swift → JS
    function receiveFromSwift(text) {
      document.getElementById("response").innerText = text;
    }
  </script>

</body>

</html>
